name: shopaflow
description: Modern mobile Point of Sale (POS) system for shops, bars, and wholesalers with offline support

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # UI and Navigation
  cupertino_icons: ^1.0.6
  material_color_utilities: ^0.11.1

  # State Management
  provider: ^6.1.1

  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Network and HTTP
  http: ^1.1.0
  dio: ^5.3.2

  # Data Serialization
  json_annotation: ^4.8.1

  # Utilities
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  uuid: ^4.1.0

  # Printing
  printing: ^5.11.1
  print_bluetooth_thermal: ^1.1.1
  esc_pos_utils_plus: ^2.0.1
  image: ^4.0.17
  sunmi_printer_plus: ^4.1.1

  # Cloud Services (Supabase)
  supabase_flutter: ^2.10.0

  # Authentication
  crypto: ^3.0.3

  # File Operations and Export
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  csv: ^5.0.2
  pdf: ^3.10.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/
    - assets/icons/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
