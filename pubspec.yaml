name: ShopaFlow
description: A modern mobile Point of Sale (POS) system for shops, bars, and wholesalers

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # UI and Navigation
  cupertino_icons: ^1.0.6
  material_color_utilities: ^0.11.1

  # State Management
  provider: ^6.1.1

  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Network and HTTP
  http: ^1.1.0
  dio: ^5.3.2

  # Data Serialization
  json_annotation: ^4.8.1

  # Utilities
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  uuid: ^4.1.0

  # Cloud Services (Supabase) - Updated to latest version for better compatibility
  supabase_flutter: ^2.10.0

  # Authentication
  crypto: ^3.0.3

  # File Operations and Export
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  csv: ^5.0.2
  pdf: ^3.10.7
  # printing: ^5.11.1  # Temporarily commented out due to build issues

  # Hardware Integration (Future phases)
  # bluetooth_print: ^4.2.1  # Temporarily commented out due to namespace issue
  # qr_code_scanner: ^1.0.1  # Temporarily commented out due to namespace issue

  # Development Dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/

  # Fonts
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Medium.ttf
  #         weight: 500
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700
